<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" aria-labelledby="gfb1t" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><title id="gfb1t">Exit preparation as a 36-month timeline in three stages: build systems, prove it works, polish. A single founder line branches into four strands of systems during the first year; the founder line ends at 24 months while the systems carry on, marked month by month, and gather together in the last year. A green line runs under the whole 36 months and turns up at the sale.</title><rect width="1200" height="800" fill="#f6f5f2"></rect><path d="M84 78V64H98M1102 64H1116V78M1116 722V736H1102M98 736H84V722" fill="none" stroke="#a9a8a4" stroke-width="1" vector-effect="non-scaling-stroke"></path><text x="150" y="228" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="22"><tspan fill="#111112">36 months:</tspan><tspan fill="#55575d"> build systems</tspan></text><text x="456" y="228" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="22"><tspan fill="#111112">24 months:</tspan><tspan fill="#55575d"> prove it works</tspan></text><text x="756" y="228" font-family="'DM Sans',Helvetica,Arial,sans-serif" font-size="22"><tspan fill="#111112">12 months:</tspan><tspan fill="#55575d"> polish</tspan></text><path d="M150 251V261M150 256H444M444 251V261" fill="none" stroke="#55575d" stroke-width="1" vector-effect="non-scaling-stroke"></path><path d="M456 251V261M456 256H744M744 251V261" fill="none" stroke="#55575d" stroke-width="1" vector-effect="non-scaling-stroke"></path><path d="M756 251V261M756 256H1050M1050 251V261" fill="none" stroke="#55575d" stroke-width="1" vector-effect="non-scaling-stroke"></path><path d="M150 380H450M450 371V389" fill="none" stroke="#55575d" stroke-width="1.25" vector-effect="non-scaling-stroke"></path><path d="M178 380C206 380 206 312 234 312H790C900 312 930 368 1030 368H1050M236 380C264 380 264 346 292 346H790C900 346 930 376 1030 376H1050M294 380C322 380 322 41